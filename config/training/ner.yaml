_model_patch:
  num_labels: 9

dataset:
  type: HuggingfaceDataset
  name: conll2003
  path: lhoestq/conll2003  # https://discuss.huggingface.co/t/cannot-load-conll2003/169142
  subset_name: null
  input_columns: [tokens]
  target_columns: [ner_tags]
  splits: {train: train, validation: validation}

trainer:
  type: TokenClassificationTrainer
  seed: 42
  logging_steps: 1
  eval_steps: 0.02 # per epoch

  num_train_epochs: 50
  per_device_train_batch_size: 512
  per_device_eval_batch_size: 512
  dataloader_num_workers: 8
  bf16: true

  optim: adamw_torch
  learning_rate: 5.0e-4
  lr_scheduler_type: constant
  warmup_steps: 0
