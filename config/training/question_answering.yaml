_model_patch: {}

dataset:
  type: HuggingfaceDataset
  name: squad
  path: rajpurkar/squad
  subset_name: null
  input_columns: [question, context]
  target_columns: [answers]
  splits: {train: train, validation: validation}

trainer:
  type: QuestionAnsweringTrainer
  seed: 42
  logging_steps: 1
  eval_steps: 0.1 # per epoch

  num_train_epochs: 5
  per_device_train_batch_size: 256
  per_device_eval_batch_size: 256
  dataloader_num_workers: 8
  bf16: true

  optim: adamw_torch
  learning_rate: 2.0e-4
  lr_scheduler_type: constant
  warmup_steps: 0
